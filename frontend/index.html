<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locadora de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <h1>Locadora de Filmes</h1>

        <button id="btnBuscar">Buscar Filmes</button>

        <p id="mensagem"></p>

        <table id="tabelaFilmes">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Gênero</th>
                    <th>Duração</th>
                    <th>Classificação</th>
                    <th>Ano</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaFilmes">
            </tbody>
        </table>

        <section>

            <h2>Cadastrar Filme</h2>

            <form id="formFilme">

                <label for="titulo">Título:</label>
                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    required
                >

                <label for="genero">Gênero:</label>
                <input
                    type="text"
                    id="genero"
                    name="genero"
                    required
                >

                <label for="duracao">Duração (minutos):</label>
                <input
                    type="number"
                    id="duracao"
                    name="duracao"
                    required
                >

                <label for="classificacao">Classificação:</label>
                <input
                    type="text"
                    id="classificacao"
                    name="classificacao"
                    required
                >

                <label for="ano">Ano:</label>
                <input
                    type="number"
                    id="ano"
                    name="ano"
                    required
                >

                <button type="submit" id="btnSalvar">
                    Cadastrar
                </button>

            </form>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
